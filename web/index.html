<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>CelLab</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    canvas { border: 1px solid #888; image-rendering: pixelated; }
    #controls { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>CelLab</h1>
  <div id="controls">
    <select id="automaton"></select>
    Generații: <input id="generations" type="number" value="50" min="1" max="300">
    Viteză:
    <input id="speed" type="range" min="20" max="1000" value="300" step="20">
    <span id="speedValue">300 ms</span>
      <button id="simulate">Simulează</button>
      <button id="stop">Stop</button>
    <span id="status"></span>
  </div>
  <canvas id="canvas" width="600" height="600"></canvas>

  <script>
    const select = document.getElementById("automaton");
    const status = document.getElementById("status");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const speed = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");
    const COLORS = ["#ffffff", "#000000", "#e63946", "#457b9d"];
    let timer = null;

    speed.addEventListener("input", () => {
      speedValue.textContent = `${speed.value} ms`;
    });

    async function loadAutomata() {
      const res = await fetch("/automata");
      const names = await res.json();
      for (const name of names) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      }
    }

    function drawCells(row, y, cell) {
      for (let x = 0; x < row.length; x++) {
        ctx.fillStyle = COLORS[row[x]];
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    function stopAnimation(message) {
      clearTimeout(timer);
      timer = null;
      if (message) status.textContent = message;
    }

    function animate(data) {
      const gens = data.generations;
      let i = 0;
      stopAnimation();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const tick = (drawFrame) => {
        drawFrame(i);
        status.textContent = `Generația ${i} / ${gens.length - 1}`;
        i++;
        if (i < gens.length) {
          timer = setTimeout(() => tick(drawFrame), Number(speed.value));
        } else {
          timer = null;
        }
      };

      if (data.dimensions === 1) {
        const cell = Math.min(canvas.width / gens[0].length, canvas.height / gens.length);
        tick((k) => drawCells(gens[k], k, cell));
      } else {
        const cell = Math.min(canvas.width / gens[0][0].length, canvas.height / gens[0].length);
        tick((k) => gens[k].forEach((row, y) => drawCells(row, y, cell)));
      }
    }

    document.getElementById("stop").addEventListener("click", () => {
      if (timer !== null) {
        stopAnimation(status.textContent + " (oprit)");
      }
    });

    document.getElementById("simulate").addEventListener("click", async () => {
      stopAnimation();
      status.textContent = "Se calculează...";
      const res = await fetch("/simulate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          automaton: select.value,
          generations: Number(document.getElementById("generations").value),
        }),
      });
      if (!res.ok) {
        status.textContent = "Eroare: " + (await res.text());
        return;
      }
      animate(await res.json());
    });

    loadAutomata();
  </script>
</body>
</html>
